name: Build and Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  posix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            libdir: lib64
          - os: ubuntu-24.04-arm
            libdir: lib
#          - os: macos-15-intel
#            libdir: lib
#          - os: macos-15
#            libdir: lib64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: source with spaces
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          path: source with spaces
      - name: Configure Release
        run: cmake -S . -B 'build with spaces' -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_LIBDIR=${{ matrix.libdir }}
      - name: Build
        run: cmake --build 'build with spaces' --parallel 3
      - name: Run complete native suite
        run: ctest --test-dir 'build with spaces' --output-on-failure --parallel 3 --output-junit "$PWD/build with spaces/results.xml"
      - name: Record native ABI and current performance samples
        run: |
          mkdir -p 'build with spaces/host evidence'
          'build with spaces/tests/host_abi_report' > 'build with spaces/host evidence/abi.json'
          cmake --build 'build with spaces' --target context_access_benchmark --parallel 3
          python3 -B tests/host/measure.py --ada 'build with spaces/ada/ada' --build 'build with spaces' --context-probe 'build with spaces/tests/context_access_benchmark' --work 'build with spaces/host evidence' --runs 11
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: host-${{ matrix.os }}
          path: |
            source with spaces/build with spaces/results.xml
            source with spaces/build with spaces/Testing/Temporary/
            source with spaces/build with spaces/host evidence/*.json
            source with spaces/build with spaces/tests/host installation/*.json
            source with spaces/build with spaces/tests/host installation/*.log
          if-no-files-found: warn

  msys2:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
        working-directory: source with spaces
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          path: source with spaces
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-python
      - name: Configure Release
        run: cmake -G 'MinGW Makefiles' -S . -B 'build with spaces' -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_LIBDIR=lib
      - name: Build
        run: cmake --build 'build with spaces' --parallel 3
      - name: Run complete native suite including threading
        run: ctest --test-dir 'build with spaces' --output-on-failure --parallel 3 --output-junit "$PWD/build with spaces/results.xml"
      - name: Record native LLP64 ABI and current performance samples
        run: |
          mkdir -p 'build with spaces/host evidence'
          'build with spaces/tests/host_abi_report.exe' > 'build with spaces/host evidence/abi.json'
          cmake --build 'build with spaces' --target context_access_benchmark --parallel 3
          python -B tests/host/measure.py --ada 'build with spaces/ada/ada.exe' --build 'build with spaces' --context-probe 'build with spaces/tests/context_access_benchmark.exe' --work 'build with spaces/host evidence' --runs 11
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: host-windows-ucrt64
          path: |
            source with spaces/build with spaces/results.xml
            source with spaces/build with spaces/Testing/Temporary/
            source with spaces/build with spaces/host evidence/*.json
            source with spaces/build with spaces/tests/host installation/*.json
            source with spaces/build with spaces/tests/host installation/*.log
          if-no-files-found: warn
